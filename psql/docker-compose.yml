services:
  db:
    image: postgres:17-alpine
    container_name: sydesk_db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      #- POSTGRES_DB=helpdesk
    volumes:
      - postgres_data:/var/lib/postgresql/data
      #- ./helpdesk_03_02_26.sql:/tmp/backup.dump
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d helpdesk"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_gui
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: mantequilla@sycom.com.ve
      PGADMIN_DEFAULT_PASSWORD: root
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:

